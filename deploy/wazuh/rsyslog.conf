# Install the rsyslog GnuTLS module on the SIEM receiver.
# The certificate must cover the hostname in GATEWAY_SIEM_SYSLOG_URL.
# Restrict TCP 6514 to the gateway at the receiver's firewall.
global(
  DefaultNetstreamDriverCAFile="/etc/rsyslog/tls/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog/tls/server.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog/tls/server.key"
)
module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.AuthMode="anon")
template(name="OpenPactJson" type="string" string="%msg%\n")
ruleset(name="OpenPact") {
  if $programname == "open-pact" then {
    action(type="omfile" file="/var/log/open-pact/events.jsonl" template="OpenPactJson")
  }
  stop
}
input(type="imtcp" port="6514" ruleset="OpenPact")
