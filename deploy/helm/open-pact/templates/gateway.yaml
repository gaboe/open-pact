{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway
      {{- if .Values.manifest }}
      annotations:
        checksum/manifest: {{ .Values.manifest | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.gateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.manifest }}
            - name: MANIFEST_PATH
              value: /etc/open-pact/custom/manifest.toml
            {{- end }}
            - name: GATEWAY_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.kekSecret.name: create a Secret with a 32-byte base64 key-encryption key and name it here" .Values.gateway.kekSecret.name }}
                  key: {{ .Values.gateway.kekSecret.key }}
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: LOG_ORIGIN
              value: {{ .Values.log.origin | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | default (printf "https://%s" .Values.ingress.host) | quote }}
            - name: AUTO_APPROVE
              value: {{ .Values.autoApprove | quote }}
            - name: WITNESS_URLS
              value: {{ join "," .Values.log.witnessUrls | quote }}
            - name: NONCE_MAX_PER_WINDOW
              value: {{ .Values.nonces.maxPerWindow | quote }}
            - name: NONCE_WINDOW_SECS
              value: {{ .Values.nonces.windowSecs | quote }}
            - name: NONCE_MAX_OUTSTANDING
              value: {{ .Values.nonces.maxOutstanding | quote }}
            {{- if .Values.database.externalUrl }}
            - name: DATABASE_URL
              value: {{ .Values.database.externalUrl | quote }}
            {{- else }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-pact.secretName" . }}
                  key: {{ .Values.postgres.existingSecretKey }}
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}:$(DB_PASSWORD)@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          {{- if .Values.manifest }}
          volumeMounts:
            - name: manifest
              mountPath: /etc/open-pact/custom
              readOnly: true
          {{- end }}
      {{- if .Values.manifest }}
      volumes:
        - name: manifest
          configMap:
            name: {{ .Release.Name }}-manifest
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector:
    app: {{ .Release.Name }}-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" .Release.Name) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  name: http
{{- end }}
{{- end }}
