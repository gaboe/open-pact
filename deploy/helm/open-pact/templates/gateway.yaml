{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gateway
      {{- if or .Values.manifest .Values.metrics.enabled }}
      annotations:
        {{- if .Values.manifest }}
        checksum/manifest: {{ .Values.manifest | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        open-pact.io/metrics-rotation: {{ .Values.metrics.rotation | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.gateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.gateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.gateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- if .Values.siem.enabled }}
            {{- if not (has .Values.siem.fileMode (list "0600" "0640")) }}
            {{- fail "siem.fileMode must be \"0600\" or \"0640\"" }}
            {{- end }}
            - name: GATEWAY_SIEM_SYSLOG_URL
              value: {{ required "siem.syslogUrl is required" .Values.siem.syslogUrl | quote }}
            - name: GATEWAY_SIEM_CA
              value: /etc/open-pact/siem/ca.pem
            - name: GATEWAY_SIEM_RETENTION_DAYS
              value: {{ .Values.siem.retentionDays | quote }}
            - name: GATEWAY_SIEM_FILE_MODE
              value: {{ .Values.siem.fileMode | quote }}
            {{- end }}
            {{- if .Values.manifest }}
            - name: MANIFEST_PATH
              value: /etc/open-pact/custom/manifest.toml
            {{- end }}
            - name: GATEWAY_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.kekSecret.name: create a Secret with a 32-byte base64 key-encryption key and name it here" .Values.gateway.kekSecret.name }}
                  key: {{ .Values.gateway.kekSecret.key }}
            - name: LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: LOG_ORIGIN
              value: {{ .Values.log.origin | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | default (printf "https://%s" .Values.ingress.host) | quote }}
            - name: AUTO_APPROVE
              value: {{ .Values.autoApprove | quote }}
            - name: WITNESS_URLS
              value: {{ join "," .Values.log.witnessUrls | quote }}
            - name: NONCE_MAX_PER_WINDOW
              value: {{ .Values.nonces.maxPerWindow | quote }}
            - name: NONCE_WINDOW_SECS
              value: {{ .Values.nonces.windowSecs | quote }}
            - name: NONCE_MAX_OUTSTANDING
              value: {{ .Values.nonces.maxOutstanding | quote }}
            {{- if not (kindIs "invalid" .Values.database.maxConnections) }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.database.readPoolConnections) }}
            - name: READ_POOL_CONNECTIONS
              value: {{ .Values.database.readPoolConnections | quote }}
            {{- end }}
            - name: SLOW_REQUEST_MS
              value: {{ .Values.gateway.slowRequestMs | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_ADDR
              value: 0.0.0.0:{{ .Values.metrics.port }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "metrics.tokenSecret.name: create a Secret holding a random scrape token (openssl rand -hex 32) and name it here" .Values.metrics.tokenSecret.name | quote }}
                  key: {{ .Values.metrics.tokenSecret.key | quote }}
            - name: METRICS_TLS_CERT
              value: /etc/open-pact/metrics-tls/tls.crt
            - name: METRICS_TLS_KEY
              value: /etc/open-pact/metrics-tls/tls.key
            {{- end }}
            {{- if .Values.database.externalUrl }}
            - name: DATABASE_URL
              value: {{ .Values.database.externalUrl | quote }}
            {{- else }}
            # The raw Secret value: a URL would need it percent-encoded, PostgreSQL needs it raw.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "open-pact.secretName" . }}
                  key: {{ .Values.postgres.existingSecretKey }}
            - name: DATABASE_URL
              value: postgres://{{ .Values.postgres.user }}@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          {{- if or .Values.manifest .Values.siem.enabled .Values.metrics.enabled }}
          volumeMounts:
            {{- if .Values.metrics.enabled }}
            - name: metrics-tls
              mountPath: /etc/open-pact/metrics-tls
              readOnly: true
            {{- end }}
            {{- if .Values.siem.enabled }}
            - name: siem-ca
              mountPath: /etc/open-pact/siem
              readOnly: true
            {{- end }}
            {{- if .Values.manifest }}
            - name: manifest
              mountPath: /etc/open-pact/custom
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.manifest .Values.siem.enabled .Values.metrics.enabled }}
      volumes:
        {{- if .Values.metrics.enabled }}
        - name: metrics-tls
          secret:
            secretName: {{ required "metrics.tlsSecret.name: name a kubernetes.io/tls Secret (for example from cert-manager) for the metrics listener" .Values.metrics.tlsSecret.name | quote }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if .Values.siem.enabled }}
        - name: siem-ca
          secret:
            secretName: {{ required "siem.caSecret.name is required when SIEM is enabled" .Values.siem.caSecret.name }}
            items:
              - key: {{ .Values.siem.caSecret.key | quote }}
                path: ca.pem
        {{- end }}
        {{- if .Values.manifest }}
        - name: manifest
          configMap:
            name: {{ .Release.Name }}-manifest
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  selector:
    app: {{ .Release.Name }}-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.metrics.enabled }}
---
# Its own Service: the metrics port is never behind the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metrics
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-gateway
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- with .Values.metrics.networkPolicy.from }}
---
# Defence in depth: the public port stays open to all, the metrics port only to these sources.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Release.Name }}-gateway-metrics
spec:
  podSelector:
    matchLabels:
      app: {{ $.Release.Name }}-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.metrics.port }}
{{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-gateway
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" .Release.Name) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  name: http
{{- end }}
{{- end }}
