image:
  repository: registry.example.com/open-pact-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

gateway:
  # Set false for a witness-only release in the witness operator's cluster.
  enabled: true
  # Required. An existing Secret holding the key-encryption key: 32 random bytes, base64.
  # It encrypts the gateway keys and claims in PostgreSQL. Keep a copy outside the cluster:
  # without it the database cannot be read.
  #   kubectl create secret generic pact-gateway-kek --from-literal=kek="$(openssl rand -base64 32)"
  kekSecret:
    name: ""
    key: kek
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# The signed manifest as TOML text. Empty: the gateway enforces the example manifest built into the
# image. Set it to run your own: the chart mounts it at /etc/open-pact/custom/manifest.toml, sets
# MANIFEST_PATH, and restarts the pod when the text changes. Keep the manifest in your deployment
# config, for example `--set-file manifest=company-manifest.toml`; no image rebuild is needed.
manifest: ""

ingress:
  enabled: true
  host: pact.example.com
  ingressClassName: nginx
  annotations: {}
  # TLS is on by default: the invitation code and the claims must not cross the network in clear.
  tls: true
  # Defaults to <release>-tls, for example from cert-manager.
  tlsSecretName: ""

postgres:
  enabled: true
  image: postgres:17
  database: pact
  user: pact
  # Required unless existingSecret names a Secret with the password under existingSecretKey.
  password: ""
  existingSecret: ""
  existingSecretKey: password
  storageClass: ""
  size: 5Gi

database:
  externalUrl: ""

# URL the clients use, written into invitations. Defaults to https://<ingress.host>.
publicUrl: ""

nonces:
  # Per source address and window. Behind the ingress every device shares one address, so size it for the fleet.
  maxPerWindow: 600
  windowSecs: 60
  # POST /v1/nonce answers 503 while this many unexpired nonces exist.
  maxOutstanding: 10000

# Approve enrolled devices without IT. Off: IT runs `open-pact-gateway devices approve`.
autoApprove: false

log:
  # Checkpoint origin and log key name (c2sp.org/tlog-checkpoint).
  origin: pact.example.com/log
  # add-checkpoint URL prefixes of the witnesses (c2sp.org/tlog-witness). The gateway sends each new
  # checkpoint there and keeps the cosignatures that the manifest's [log] witness keys verify.
  witnessUrls: []

# Optional witness (c2sp.org/tlog-witness) with its own key and state. A witness detects a forking
# gateway only if someone other than the gateway operator runs it, for example the contractor or
# an auditor. Install it in their cluster, not next to the gateway, with gateway.enabled=false and
# witness.enabled=true: that release needs no gateway or database secret and renders only the witness.
# Run one replica per witness key: a second process on the same state refuses to start.
witness:
  enabled: false
  image:
    repository: registry.example.com/open-pact-witness
    tag: latest
    pullPolicy: IfNotPresent
  # Key name; the manifest's [log] witnesses list it with the key `open-pact-witness vkey` prints.
  name: witness.example.org/w1
  # Secret holding the Ed25519 seed as 64 hex digits, created with `open-pact-witness keygen`.
  keySecret:
    name: ""
    key: witness.key
  # Verifier keys of the logs to witness (the gateway's GET /v1/log/key), confirmed out of band.
  logKeys: []
  # The state is the latest cosigned checkpoint per log. Losing it lets the gateway roll back.
  storageClass: ""
  size: 100Mi
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  # fsGroup lets the non-root user write the state volume.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# Optional SIEM export. TLS only. The CA Secret must contain PEM certificates.
siem:
  enabled: false
  syslogUrl: tls://siem.example.com:6514
  caSecret:
    name: ""
    key: ca.pem
  # Set to the SIEM's actual retention. A value above claim_retention logs a warning.
  retentionDays: 30
