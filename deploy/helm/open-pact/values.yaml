image:
  repository: registry.example.com/open-pact-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

ingress:
  enabled: true
  host: pact.example.com
  ingressClassName: nginx
  annotations: {}
  tlsSecretName: ""

postgres:
  enabled: true
  image: postgres:17
  database: pact
  user: pact
  password: change-me
  existingSecret: ""
  existingSecretKey: password
  storageClass: ""
  size: 5Gi

database:
  externalUrl: ""

log:
  # Checkpoint origin and log key name (c2sp.org/tlog-checkpoint).
  origin: pact.example.com/log
  # Witness verifier keys (Ed25519 cosignature/v1) whose cosignatures POST /v1/log/witness accepts.
  witnessKeys: []
