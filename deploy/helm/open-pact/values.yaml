image:
  repository: registry.example.com/open-pact-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

gateway:
  # Required. An existing Secret holding the key-encryption key: 32 random bytes, base64.
  # It encrypts the gateway keys and claims in PostgreSQL. Keep a copy outside the cluster:
  # without it the database cannot be read.
  #   kubectl create secret generic pact-gateway-kek --from-literal=kek="$(openssl rand -base64 32)"
  kekSecret:
    name: ""
    key: kek

ingress:
  enabled: true
  host: pact.example.com
  ingressClassName: nginx
  annotations: {}
  # TLS is on by default: the invitation code and the claims must not cross the network in clear.
  tls: true
  # Defaults to <release>-tls, for example from cert-manager.
  tlsSecretName: ""

postgres:
  enabled: true
  image: postgres:17
  database: pact
  user: pact
  # Required unless existingSecret names a Secret with the password under existingSecretKey.
  password: ""
  existingSecret: ""
  existingSecretKey: password
  storageClass: ""
  size: 5Gi

database:
  externalUrl: ""

# URL the clients use, written into invitations. Defaults to https://<ingress.host>.
publicUrl: ""

nonces:
  # Per source address and window. Behind the ingress every device shares one address, so size it for the fleet.
  maxPerWindow: 600
  windowSecs: 60
  # POST /v1/nonce answers 503 while this many unexpired nonces exist.
  maxOutstanding: 10000

# Approve enrolled devices without IT. Off: IT runs `open-pact-gateway devices approve`.
autoApprove: false

log:
  # Checkpoint origin and log key name (c2sp.org/tlog-checkpoint).
  origin: pact.example.com/log
  # add-checkpoint URL prefixes of the witnesses (c2sp.org/tlog-witness). The gateway sends each new
  # checkpoint there and keeps the cosignatures that the manifest's [log] witness keys verify.
  witnessUrls: []

# Optional witness (c2sp.org/tlog-witness) with its own key and state. A witness detects a forking
# gateway only if someone other than the gateway operator runs it, for example the contractor or
# an auditor. Install it in their cluster with only this section enabled, not next to the gateway.
witness:
  enabled: false
  image:
    repository: registry.example.com/open-pact-witness
    tag: latest
    pullPolicy: IfNotPresent
  # Key name; the manifest's [log] witnesses list it with the key `open-pact-witness vkey` prints.
  name: witness.example.org/w1
  # Secret holding the Ed25519 seed as 64 hex digits, created with `open-pact-witness keygen`.
  keySecret:
    name: ""
    key: witness.key
  # Verifier keys of the logs to witness (the gateway's GET /v1/log/key), confirmed out of band.
  logKeys: []
  # The state is the latest cosigned checkpoint per log. Losing it lets the gateway roll back.
  storageClass: ""
  size: 100Mi
