[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0346", reason = "No custom rustls ClientSessionStore is used; rustls documents the built-in session cache Debug output as redacted." },
    { id = "RUSTSEC-2026-0347", reason = "The workspace does not enable rustls ECH or call EchMode::Enable." },
    { id = "RUSTSEC-2026-0348", reason = "The workspace does not enable rustls Brotli certificate decompression." },
    { id = "RUSTSEC-2026-0349", reason = "The workspace does not enable rustls prefer-post-quantum, so the affected hybrid key-share prediction is inactive." },
    { id = "RUSTSEC-2026-0009", reason = "Workspace code uses time for current time and durations; it does not parse untrusted RFC 2822 input. x509-parser only formats RFC 2822 dates." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
