services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 2s
      timeout: 3s
      retries: 30
  gateway:
    build: .
    environment:
      DATABASE_URL: postgres://pact:pact@db:5432/pact
      LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
