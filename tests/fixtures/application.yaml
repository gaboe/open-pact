apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-pact
spec:
  source:
    chart: open-pact
    helm:
      values: |
        replicas: 1
        manifest: |
          # Example manifest. Fictional.
          manifest_version = 1
          [company]
          name = "Example Company"
          [schedule]
          mode = "vpn"
          probe = "10.0.0.1:443"
          interval = "55m"
          [[controls]]
          id = "password_min_length"
          enabled = true
          require = { min = 10 }
          grace = "24h"
          folders = ["~/Documents"]
        unrelated: keep this exactly
  destination:
    namespace: open-pact
