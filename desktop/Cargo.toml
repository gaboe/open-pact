[workspace]
members = ["crates/runner", "crates/client", "crates/admin"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
runner = { path = "crates/runner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.23", features = ["serde"] }
dirs = "6"
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = { version = "=0.8.0", features = ["tree-sitter-toml"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders", "font-kit", "x11", "wayland"] }
gpui-kit-assets = "=0.8.0"
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9", features = ["font-kit"] }
