[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The desktop workspace declares its own crates as path dependencies without a version
# (runner in desktop/Cargo.toml), so cargo-deny reports them as wildcards.
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "0BSD", # enum-iterator-derive, needed by enum-iterator, needed by gpui-component
    "CC0-1.0", # hexf-parse (naga, wgpu), notify (gpui-component), tiny-keccak (zed-xim, gpui-pre-linux)
    "MPL-2.0", # option-ext (dirs, zed-font-kit), dwrote (zed-font-kit, Windows), cbindgen (build of gpui-pre-apple)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
