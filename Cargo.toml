[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["desktop"]

[workspace.package]
version = "0.8.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
open-pact-core = { path = "crates/open-pact-core", version = "0.8.5" }
open-pact-client = { path = "crates/open-pact-client", version = "0.8.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }

# The patch-age check hashes every cached APT index within the 3 s check budget, also in
# the debug build the Linux container tests run.
[profile.dev.package.sha2]
opt-level = 3

# The gateway bounds one checkpoint candidate at 100 ms for 1,000,000 leaves (docs/gateway.md); its
# O(size) Merkle root lives in this crate, and the test profile must meet the same bound.
[profile.dev.package.open-pact-core]
opt-level = 3
