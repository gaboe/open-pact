[package]
name = "open-pact-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "open_pact_client"
path = "src/lib.rs"

[[bin]]
name = "open-pact-client"
path = "src/main.rs"

[dependencies]
open-pact-core.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
tokio = { workspace = true, features = ["process", "sync"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
toml = "1.1.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23.1"
sha2 = "0.11.0"
hex = "0.4.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = { version = "0.18", features = ["verify"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3.7"
security-framework-sys = "2.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
p256 = "0.14.0"
ed25519-dalek = "2.2.0"
tempfile = "3"
