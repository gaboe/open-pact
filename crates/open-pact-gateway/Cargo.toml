[package]
name = "open-pact-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
open-pact-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "json", "macros", "time"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
hex = "0.4.3"
sha2 = "0.11"
time = "0.3"
x509-parser = "0.18"
aes-gcm = "0.11"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
prometheus-client = { version = "0.25.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
subtle = "2.6.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
ed25519-dalek = "2.2.0"
open-pact-client = { path = "../open-pact-client" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
