name: dependency-check

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.99.0"
          command: check
          arguments: --all-features
          command-arguments: advisories licenses bans sources
