name: windows-packaging

on:
  pull_request:
    paths-ignore: ['desktop/**']
  push:
    branches: [main]
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces its run. Runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scoop-local-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build client
        run: cargo build --locked --release --package open-pact-client --target x86_64-pc-windows-msvc
      - name: Check the Windows client imports no Visual C++ runtime
        run: python scripts/packaging/check-windows-imports.py target/x86_64-pc-windows-msvc/release/open-pact-client.exe
      - name: Install Scoop from a local manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression

          $binaryDir = Join-Path $env:RUNNER_TEMP 'open-pact-client'
          New-Item -ItemType Directory -Force $binaryDir | Out-Null
          $binaryName = 'open-pact-client-x86_64-pc-windows-msvc.exe'
          Copy-Item 'target/x86_64-pc-windows-msvc/release/open-pact-client.exe' (Join-Path $binaryDir $binaryName)
          $binaryPath = Join-Path $binaryDir $binaryName
          $checksumPath = Join-Path $env:RUNNER_TEMP 'SHA256SUMS'
          $binaryHash = (Get-FileHash $binaryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$binaryHash  $binaryName" | Set-Content -Encoding ascii $checksumPath
          $manifestDir = Join-Path $env:RUNNER_TEMP 'manifest'
          python scripts/packaging/generate-release-metadata.py 0.0.0-ci $checksumPath `
            --scoop-only --scoop-dir $manifestDir --scoop-url "http://127.0.0.1:8765/$binaryName"
          $manifestPath = Join-Path $manifestDir 'open-pact.json'

          $server = Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $binaryDir) -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -Uri "http://127.0.0.1:8765/$binaryName" -Method Head | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'Local binary server did not start.' }
            scoop install $manifestPath
            open-pact-client --version
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  machine-package:
    name: Machine package fixtures and install sequence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@2016bd2012dba4e32de620c46fe006a3ac9f0602 # v5.0.1
        with:
          dotnet-version: 8.0.x
      - name: Install WiX
        shell: pwsh
        run: ./scripts/packaging/install-wix.ps1
      - name: Build the fixtures and run the install sequence
        shell: pwsh
        run: ./packaging/windows/tests/machine-package.ps1 -Work "$env:RUNNER_TEMP/machine-package"
      - name: Check the winget manifests against the built MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $PWD 'scripts/packaging/msi-tools.ps1')
          $work = Join-Path $env:RUNNER_TEMP 'winget-check'
          New-Item -ItemType Directory -Force $work | Out-Null
          $msiName = 'open-pact-client-x86_64-pc-windows-msvc.msi'
          $msi = Join-Path $work $msiName
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'machine-package/fixtures/b2.msi') -Destination $msi
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = Join-Path $work 'SHA256SUMS'
          "$hash  $msiName" | Set-Content -Encoding ascii $sums
          $winget = Join-Path $work 'winget'
          python scripts/packaging/generate-release-metadata.py 0.0.2 $sums --winget-only --winget-test --winget-dir $winget
          if ($LASTEXITCODE -ne 0) { throw "generate-release-metadata exits with $LASTEXITCODE." }
          $installer = Get-Content -Raw -LiteralPath (Join-Path $winget 'gaboe.open-pact.test.installer.yaml')
          $expected = @{
              ProductCode = Get-MsiProperty -Path $msi -Name 'ProductCode'
              UpgradeCode = Get-UpgradeCode -Wxs (Join-Path $PWD 'packaging/windows/open-pact-client.wxs')
              DisplayVersion = Get-MsiProperty -Path $msi -Name 'ProductVersion'
          }
          foreach ($key in $expected.Keys) {
              if (-not $installer.Contains("${key}: ""$($expected[$key])""")) { throw "The winget installer manifest does not name $key $($expected[$key])." }
          }
          winget --version
          $out = winget validate --manifest $winget 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -eq -1978335192) {
              # Older winget on the runner warns on schema headers newer than its own; the schema fields still validate.
              $warnings = @($out -split "\r?\n" | Where-Object { $_ -match '^Manifest Warning:' })
              $other = @($warnings | Where-Object { $_ -notmatch '^Manifest Warning: The schema header URL does not match the expected pattern\. Value: ' })
              if ($warnings.Count -eq 0 -or $other.Count -ne 0) { throw "winget validate warns: $($other -join '; ')" }
              $global:LASTEXITCODE = 0
          } elseif ($code -ne 0) { throw "winget validate exits with $code." }
      - name: Upload the fixtures
        uses: actions/upload-artifact@v4
        with:
          name: machine-package-fixtures
          path: ${{ runner.temp }}/machine-package/fixtures
          if-no-files-found: error
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-package-logs
          path: ${{ runner.temp }}/machine-package/logs
          if-no-files-found: warn
