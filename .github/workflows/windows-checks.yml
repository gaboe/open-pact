name: windows-checks

on:
  push:
    paths-ignore: ['desktop/**']
  pull_request:
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Windows client
        run: cargo test -p open-pact-client -- --show-output

      - name: Verify elevated CNG roundtrip
        run: cargo test -p open-pact-client windows_cng_software_provider_roundtrip -- --ignored --nocapture

      - name: Verify CNG signing and deletion as creator, administrator, and SYSTEM
        timeout-minutes: 8
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $build = cargo test -p open-pact-client --no-run --message-format=json | ForEach-Object { $_ | ConvertFrom-Json }
          if ($LASTEXITCODE -ne 0) { throw 'CNG test build failed' }
          $test = ($build | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.name -eq 'open-pact-client' -and $_.executable } | Select-Object -First 1).executable
          if (-not $test) { throw 'CNG test executable missing' }
          $root = Join-Path $env:PUBLIC ('open-pact-cng-fictional-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item $test (Join-Path $root 'cng-tests.exe')
          $user = 'op_cng_' + [Guid]::NewGuid().ToString('N').Substring(0,8)
          $password = ConvertTo-SecureString ('Op!7' + [Guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $task = 'open-pact-cng-fictional-' + [Guid]::NewGuid().ToString('N')
          $worker = Join-Path $root 'worker.ps1'
          @'
          param($root,$action,$identity)
          $ErrorActionPreference = 'Stop'
          $current = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($identity -eq 'system') {
            if ($current.User.Value -ne 'S-1-5-18') { throw 'fixture is not SYSTEM' }
          } elseif ($identity -eq 'elevated') {
            if (-not (New-Object Security.Principal.WindowsPrincipal($current)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'fixture is not elevated' }
          } else {
            if ((New-Object Security.Principal.WindowsPrincipal($current)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'fixture is elevated' }
          }
          $env:OPEN_PACT_CNG_HOME = $root
          if ($action -eq 'software') {
            $env:OPEN_PACT_CNG_HOME = Join-Path $root 'software'
            New-Item -ItemType Directory $env:OPEN_PACT_CNG_HOME -Force | Out-Null
          }
          $env:OPEN_PACT_CNG_ACTION = $action
          $process = Start-Process (Join-Path $root 'cng-tests.exe') -ArgumentList @('windows_cng_shared_fixture','--ignored','--nocapture') -RedirectStandardOutput (Join-Path $root "$identity-$action.log") -RedirectStandardError (Join-Path $root "$identity-$action.stderr.log") -Wait -PassThru -NoNewWindow
          Set-Content (Join-Path $root "$identity-$action.exitcode") $process.ExitCode
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Set-Content (Join-Path $root "$identity-$action.ok") 'passed'
          '@ | Set-Content $worker
          try {
            New-LocalUser -Name $user -Password $password -AccountNeverExpires | Out-Null
            $sid = (Get-LocalUser $user).SID.Value
            & icacls.exe $root /grant "*${sid}:(OI)(CI)M" /T | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'CNG fixture ACL failed' }
            $credential = New-Object PSCredential("$env:COMPUTERNAME\$user", $password)
            foreach ($action in @('software')) {
              $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action $action -identity limited"
              $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru
              Get-Content (Join-Path $root "limited-$action.log")
              Get-Content (Join-Path $root "limited-$action.stderr.log")
              Write-Output "limited $action client exit code: $(Get-Content (Join-Path $root "limited-$action.exitcode"))"
              if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $root "limited-$action.ok"))) { throw "limited CNG $action failed" }
            }
            # Use one fixture SID for elevated creation and a fresh standard-user logon.
            $admins = Get-LocalGroup -SID 'S-1-5-32-544'
            Add-LocalGroupMember -Group $admins -Member $user
            $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action create -identity elevated"
            $principal = New-ScheduledTaskPrincipal -UserId $credential.UserName -LogonType Password -RunLevel Highest
            $command = New-ScheduledTaskAction -Execute powershell.exe -Argument $arguments
            Register-ScheduledTask -TaskName $task -InputObject (New-ScheduledTask -Action $command -Principal $principal) -User $credential.UserName -Password ($credential.GetNetworkCredential().Password) | Out-Null
            Start-ScheduledTask -TaskName $task
            $deadline = (Get-Date).AddMinutes(2)
            while (-not (Test-Path (Join-Path $root 'elevated-create.ok')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            Get-ScheduledTaskInfo -TaskName $task | Format-List
            Get-Content (Join-Path $root 'elevated-create.log') -ErrorAction SilentlyContinue
            Get-Content (Join-Path $root 'elevated-create.stderr.log') -ErrorAction SilentlyContinue
            Write-Output "elevated create client exit code: $(Get-Content (Join-Path $root 'elevated-create.exitcode') -ErrorAction SilentlyContinue)"
            if (-not (Test-Path (Join-Path $root 'elevated-create.ok'))) { throw 'elevated create failed' }
            Unregister-ScheduledTask -TaskName $task -Confirm:$false
            Remove-LocalGroupMember -Group $admins -Member $user
            $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action sign -identity limited"
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru
            Get-Content (Join-Path $root 'limited-sign.log')
            Get-Content (Join-Path $root 'limited-sign.stderr.log')
            Write-Output "same user limited sign client exit code: $(Get-Content (Join-Path $root 'limited-sign.exitcode'))"
            if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $root 'limited-sign.ok'))) { throw 'same user limited sign failed' }
            $env:OPEN_PACT_CNG_HOME = $root
            $env:OPEN_PACT_CNG_ACTION = 'deny-delete'
            & (Join-Path $root 'cng-tests.exe') windows_cng_shared_fixture --ignored --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'unrelated administrator deletion was not denied' }
            $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action retry-delete -identity limited"
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru
            Get-Content (Join-Path $root 'limited-retry-delete.log')
            Get-Content (Join-Path $root 'limited-retry-delete.stderr.log')
            if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $root 'limited-retry-delete.ok'))) { throw 'creator retry deletion failed' }
            Add-LocalGroupMember -Group $admins -Member $user
            Remove-Item (Join-Path $root 'elevated-create.ok')
            $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action create -identity elevated"
            $principal = New-ScheduledTaskPrincipal -UserId $credential.UserName -LogonType Password -RunLevel Highest
            $command = New-ScheduledTaskAction -Execute powershell.exe -Argument $arguments
            Register-ScheduledTask -TaskName $task -InputObject (New-ScheduledTask -Action $command -Principal $principal) -User $credential.UserName -Password ($credential.GetNetworkCredential().Password) | Out-Null
            Start-ScheduledTask -TaskName $task
            $deadline = (Get-Date).AddMinutes(2)
            while (-not (Test-Path (Join-Path $root 'elevated-create.ok')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
            Get-ScheduledTaskInfo -TaskName $task | Format-List
            Get-Content (Join-Path $root 'elevated-create.log') -ErrorAction SilentlyContinue
            Get-Content (Join-Path $root 'elevated-create.stderr.log') -ErrorAction SilentlyContinue
            Write-Output "elevated create client exit code: $(Get-Content (Join-Path $root 'elevated-create.exitcode') -ErrorAction SilentlyContinue)"
            if (-not (Test-Path (Join-Path $root 'elevated-create.ok'))) { throw 'elevated create failed' }
            Unregister-ScheduledTask -TaskName $task -Confirm:$false
            Remove-LocalGroupMember -Group $admins -Member $user
            foreach ($action in @('sign','delete')) {
              $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -root `"$root`" -action $action -identity system"
              $principal = New-ScheduledTaskPrincipal -UserId SYSTEM -LogonType ServiceAccount -RunLevel Highest
              $command = New-ScheduledTaskAction -Execute powershell.exe -Argument $arguments
              Register-ScheduledTask -TaskName $task -Action $command -Principal $principal | Out-Null
              Start-ScheduledTask -TaskName $task
              $deadline = (Get-Date).AddMinutes(2)
              while (-not (Test-Path (Join-Path $root "system-$action.ok")) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
              Get-Content (Join-Path $root "system-$action.log") -ErrorAction SilentlyContinue
              Get-Content (Join-Path $root "system-$action.stderr.log") -ErrorAction SilentlyContinue
              Write-Output "SYSTEM $action client exit code: $(Get-Content (Join-Path $root "system-$action.exitcode") -ErrorAction SilentlyContinue)"
              if (-not (Test-Path (Join-Path $root "system-$action.ok"))) { throw "SYSTEM CNG $action failed" }
              Unregister-ScheduledTask -TaskName $task -Confirm:$false
            }
          } finally {
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Measure isolated native batches
        if: always()
        shell: powershell
        run: |
          $failed = $false
          foreach ($attempt in 1..5) {
            Write-Output "isolated_batch_attempt=$attempt"
            cargo test -p open-pact-client native_batch_emits_every_metric -- --show-output
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw "An isolated native batch failed" }

      - name: Verify Windows VPN pair recovery and accepted responses
        run: |
          cargo test -p open-pact-client windows_vpn_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p open-pact-client check_keeps_the_installed_pair_if_the_new_one_is_invalid
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p open-pact-client check_installs_the_certificate_of_a_verified_response_checkpoint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows browser source fixtures
        shell: powershell
        run: ./crates/open-pact-client/src/checks/windows_browser_tests.ps1

      - name: Verify Windows fix source fixtures
        shell: powershell
        run: ./crates/open-pact-client/src/checks/windows_fix_tests.ps1

      - name: Record runner privilege
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "runner_is_administrator=$admin"

      - name: Install WiX
        shell: powershell
        run: ./scripts/packaging/install-wix.ps1

      - name: Verify the machine client, native uninstall modes, a task that is not ours and a planted user task
        timeout-minutes: 15
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          cargo build -p open-pact-client
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          $root = Join-Path $env:PUBLIC ('open-pact-fictional-' + [Guid]::NewGuid().ToString('N'))
          $env:OPEN_PACT_SCHEDULE_FIXTURE = $root
          cargo test -p open-pact-client prepare_windows_schedule_homes -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'fixture preparation failed' }
          $client = Join-Path $root 'client.exe'
          Copy-Item target/debug/open-pact-client.exe $client
          # The machine client Q is the package build of this same client, at its own version.
          $version = ((& $client --version) -split '\s+')[-1]
          $msi = Join-Path $root 'open-pact-client.msi'
          & ./scripts/packaging/build-msi.ps1 -Exe (Resolve-Path target/debug/open-pact-client.exe).Path -Version $version -Out $msi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $msi)) { throw 'the machine package was not built' }
          $Q = Join-Path $env:ProgramFiles 'open-pact-client\open-pact-client.exe'
          $user = 'op_fixture_' + [Guid]::NewGuid().ToString('N').Substring(0,8)
          $password = 'Op!7' + [Guid]::NewGuid().ToString('N')
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $user -Password $secure -AccountNeverExpires | Out-Null
          $sid = (Get-LocalUser $user).SID.Value
          & icacls.exe $root /grant "*$($sid):(OI)(CI)M" /T | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'fixture ACL setup failed' }
          $installed = $false
          $qHash = $null
          function Invoke-Msi($mode, $name) {
            $log = Join-Path $root "msi-$name.log"
            $msiexec = Join-Path ([Environment]::SystemDirectory) 'msiexec.exe'
            $process = Start-Process $msiexec -ArgumentList @($mode, "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
            if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              Get-Content $log -Tail 80 -ErrorAction SilentlyContinue
              throw "msiexec $mode failed: $($process.ExitCode)"
            }
          }
          function Invoke-Client($homePath, $arguments) {
            & $client --home $homePath @arguments
            return $LASTEXITCODE
          }
          function Invoke-Capture($homePath, $arguments) {
            $ErrorActionPreference = 'Continue'
            $lines = & $client --home $homePath @arguments 2>&1 | ForEach-Object { "$_" }
            return [pscustomobject]@{ Code = $LASTEXITCODE; Text = ($lines -join "`n") }
          }
          function Install-System($homePath) {
            $result = Invoke-Client $homePath @('schedule', 'on', '--system')
            if ($result[-1] -ne 0) { throw "SYSTEM install failed: $result" }
            Assert-Action $homePath
          }
          function State-Path($homePath) {
            $bytes = [Text.Encoding]::UTF8.GetBytes(('\\?\' + $homePath))
            $hash = ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes))).Replace('-','').ToLowerInvariant()
            return Join-Path $env:ProgramData "open-pact/system/$hash"
          }
          function Task-Name($homePath) {
            $hash = Split-Path (State-Path $homePath) -Leaf
            return 'org.open-pact.report.' + $hash.Substring(0,16)
          }
          function Assert-Action($homePath) {
            $task = Get-ScheduledTask -TaskName (Task-Name $homePath)
            $actions = @($task.Actions)
            if ($actions.Count -ne 1) { throw 'the SYSTEM task does not have exactly one action' }
            if ($actions[0].Execute.Trim('"') -ine $Q) { throw "the SYSTEM task runs $($actions[0].Execute), not the machine client" }
            if ($task.Principal.UserId -ne 'SYSTEM') { throw 'the task does not run as SYSTEM' }
          }
          function Assert-Q {
            if (-not $qHash) { return }
            if (-not (Test-Path $Q)) { throw 'the machine client is gone' }
            if ((Get-FileHash $Q).Hash -ne $qHash) { throw 'a schedule command changed the machine client' }
          }
          function Assert-Clean($homePath) {
            if (Get-ScheduledTask -TaskName (Task-Name $homePath) -ErrorAction SilentlyContinue) { throw 'task remains' }
            if (Test-Path (State-Path $homePath)) { throw 'SYSTEM state remains' }
            if (Test-Path "$env:ProgramFiles/open-pact") { throw 'a client wrote the legacy folder' }
            Assert-Q
          }
          function Remove-System($homePath) {
            $result = Invoke-Client $homePath @('schedule', 'off')
            if ($result[-1] -ne 0) {
              Write-Output $result
              $result = Invoke-Client $homePath @('schedule', 'off')
            }
            if ($result[-1] -ne 0) { throw "SYSTEM retry failed: $result" }
            Assert-Clean $homePath
          }
          function Get-Status($homePath) {
            $lines = & $client --home $homePath status --json
            return ($lines -join "`n") | ConvertFrom-Json
          }
          function Get-Block($text) {
            $lines = $text -split "`r?`n"
            $start = [array]::IndexOf($lines, '& {')
            if ($start -lt 0) { throw "no removal block in: $text" }
            $end = $start + 1
            while ($end -lt $lines.Count -and $lines[$end].TrimEnd() -ne '}') { $end++ }
            if ($end -ge $lines.Count) { throw 'the removal block has no end' }
            return ($lines[$start..$end] -join "`n")
          }
          function Assert-Refused($homePath, $arguments, $label) {
            $result = Invoke-Capture $homePath $arguments
            if ($result.Code -eq 0) { throw "$label was accepted" }
            return $result
          }
          try {
            $limited = (Resolve-Path (Join-Path $root 'limited')).Path
            # Without the machine client, a SYSTEM install fails and leaves nothing behind.
            $refused = Assert-Refused $limited @('schedule', 'on', '--system') 'a SYSTEM install without the machine client'
            if ($refused.Text -notmatch 'machine client is not installed') { throw "the refusal does not name the package: $($refused.Text)" }
            Assert-Clean $limited
            if (Test-Path (Join-Path $limited 'schedule-applied.json')) { throw 'a refused install wrote a receipt' }
            if (Test-Path $Q) { throw 'the machine client exists before the package is installed' }
            Invoke-Msi '/i' 'install'
            $installed = $true
            if (-not (Test-Path $Q)) { throw 'the package did not install the machine client' }
            $qHash = (Get-FileHash $Q).Hash
            Install-System $limited
            Unregister-ScheduledTask -TaskName (Task-Name $limited) -Confirm:$false
            $state = State-Path $limited
            $worker = Join-Path $root 'standard-user.ps1'
            @'
          param($client,$homePath,$receipt,$taskName)
          $ErrorActionPreference = 'Stop'
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            if ((New-Object Security.Principal.WindowsPrincipal($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'worker token is elevated' }
            & $client --home $homePath schedule on --user
            if ($LASTEXITCODE -ne 0) { throw 'limited install failed' }
            if (-not (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) { throw 'limited task was not installed' }
            foreach ($attempt in 1..2) {
              & $client --home $homePath schedule off
              if ($LASTEXITCODE -ne 0) { throw 'limited uninstall failed' }
              if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) { throw 'limited task remains' }
            }
            if (Test-Path "$homePath/report-schedule.json") { throw 'limited configuration remains' }
            if (Test-Path "$homePath/schedule-applied.json") { throw 'limited applied receipt remains' }
            if (Test-Path "$homePath/report-state.json") { throw 'limited report state remains' }
            & $client --home $homePath schedule on --system
            if ($LASTEXITCODE -eq 0) { throw 'standard token accepted a SYSTEM install' }
            'standard_user_limited_install_and_repeated_uninstall_passed' | Set-Content $receipt
            exit 0
          } catch { $_ | Out-String | Set-Content $receipt; exit 1 }
          '@ | Set-Content $worker
            $receipt = Join-Path $root 'standard-user-result.txt'
            $credential = New-Object PSCredential("$env:COMPUTERNAME\$user",$secure)
            $arguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$worker`" -client `"$client`" -homePath `"$limited`" -receipt `"$receipt`" -taskName `"$(Task-Name $limited)`""
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru
            Get-Content $receipt
            if ($process.ExitCode -ne 0) { throw 'standard-user fixture failed' }
            if (-not (Test-Path $state)) { throw 'limited uninstall removed protected state' }
            Assert-Q
            Remove-System $limited
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $arguments -Wait -PassThru
            Get-Content $receipt
            if ($process.ExitCode -ne 0) { throw 'standard-user uninstall without protected leftovers failed' }
            Assert-Q
            foreach ($name in @('system','missing','retry')) {
              $homePath = (Resolve-Path (Join-Path $root $name)).Path
              Install-System $homePath
              if ($name -eq 'system') { Remove-Item (State-Path $homePath) -Recurse -Force }
              if ($name -eq 'missing') { Remove-Item $homePath -Recurse -Force }
              if ($name -eq 'retry') {
                $state = State-Path $homePath
                $guard = [IO.File]::Open(($state + '.lock'),[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
                try {
                  $result = Invoke-Client $homePath @('schedule', 'off')
                  if ($result[-1] -eq 0) { throw 'held state lock reported success' }
                  if (-not (Get-ScheduledTask -TaskName (Task-Name $homePath) -ErrorAction SilentlyContinue)) { throw 'held state lock did not preserve task' }
                  Assert-Q
                } finally { $guard.Dispose() }
                $held = [IO.File]::Open((Join-Path $state 'held-fixture'),[IO.FileMode]::Create,[IO.FileAccess]::ReadWrite,[IO.FileShare]::Read)
                try {
                  $result = Invoke-Client $homePath @('schedule', 'off')
                  if ($result[-1] -eq 0 -or -not (Test-Path $state)) { throw 'injected deletion failure reported success' }
                  Write-Output $result
                } finally { $held.Dispose() }
                $result = Invoke-Client $homePath @('schedule', 'on', '--user')
                if ($result[-1] -ne 0) { throw 'replacement limited install failed' }
              }
              Remove-System $homePath
              if ($name -eq 'missing' -and (Test-Path $homePath)) { throw 'uninstall created missing home' }
            }
            # A SYSTEM task with the home's id that runs another program is not ours: every change refuses
            # and leaves it, and status says so. The printed removal block removes it with Windows tools.
            Install-System $limited
            $id = Task-Name $limited
            Unregister-ScheduledTask -TaskName $id -Confirm:$false
            $other = Join-Path ([Environment]::SystemDirectory) 'cmd.exe'
            $foreign = New-ScheduledTaskAction -Execute $other -Argument '/c exit 0'
            $at = New-ScheduledTaskTrigger -Once -At (Get-Date).AddYears(1)
            $system = New-ScheduledTaskPrincipal -UserId SYSTEM -LogonType ServiceAccount -RunLevel Highest
            Register-ScheduledTask -TaskName $id -Action $foreign -Trigger $at -Principal $system | Out-Null
            $refusals = @()
            foreach ($change in @(@('schedule','on','--system'), @('schedule','on','--user'), @('schedule','off'))) {
              $refusals += Assert-Refused $limited $change ($change -join ' ')
              $now = @((Get-ScheduledTask -TaskName $id).Actions)
              if ($now.Count -ne 1 -or $now[0].Execute -ine $other) { throw "$($change -join ' ') changed the foreign task" }
            }
            Assert-Q
            $status = Get-Status $limited
            if ($status.schedule.job_status -ne 'not_ours') { throw "elevated status says $($status.schedule.job_status), not not_ours" }
            $block = Get-Block $refusals[2].Text
            foreach ($attempt in 1..2) {
              & ([scriptblock]::Create($block))
              if (Get-ScheduledTask -TaskName $id -ErrorAction SilentlyContinue) { throw 'the removal block left the task' }
              if (Test-Path (State-Path $limited)) { throw 'the removal block left the state' }
              Assert-Q
            }
            Assert-Clean $limited
            # A task with the home's id that runs as a user is a user job. It is never not-ours and never
            # the source of the profile: the replacement reads the elevated profile, not the planted one.
            Install-System $limited
            Unregister-ScheduledTask -TaskName $id -Confirm:$false
            $planted = Join-Path $root 'planted-user-task.ps1'
            @'
          param($q,$homePath,$taskName)
          $ErrorActionPreference = 'Stop'
          $action = New-ScheduledTaskAction -Execute $q -Argument "--home `"$homePath`" schedule run --system --user-home C:\decoy"
          $trigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddYears(1) -RepetitionInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger | Out-Null
          '@ | Set-Content $planted
            $plantedArguments = "-NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$planted`" -q `"$Q`" -homePath `"$limited`" -taskName `"$id`""
            $process = Start-Process powershell.exe -Credential $credential -LoadUserProfile -ArgumentList $plantedArguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'the standard user could not register the planted task' }
            $status = Get-Status $limited
            if ($status.schedule.job_status -ne 'outdated') { throw "a user task with the home's id reports $($status.schedule.job_status), not outdated" }
            Install-System $limited
            $replaced = @((Get-ScheduledTask -TaskName $id).Actions)
            if ($replaced[0].Arguments -match 'decoy') { throw 'the replacement kept the planted profile' }
            if ($replaced[0].Arguments -notlike "*--user-home*$env:USERPROFILE*") { throw "the replacement does not read the elevated profile: $($replaced[0].Arguments)" }
            Assert-Q
            Remove-System $limited
            Write-Output 'native_system_uninstall_retry_replacement_task_not_ours_planted_and_missing_home_passed'
          } finally {
            Get-ScheduledTask -TaskName 'org.open-pact.report.*' -ErrorAction SilentlyContinue | Unregister-ScheduledTask -Confirm:$false
            if ($installed) { Invoke-Msi '/x' 'uninstall' }
            Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Probe invariant batch values
        if: always()
        shell: powershell
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ([scriptblock]::Create((Get-Content -Raw crates/open-pact-client/src/checks/windows.ps1))) | ForEach-Object {
            if ($_ -like "browsers`t*") { Write-Output "browser_settings=collected" }
            else { Write-Output $_ }
          }
          $timer.Stop()
          Write-Output ("batch_elapsed_seconds=" + $timer.Elapsed.TotalSeconds.ToString([Globalization.CultureInfo]::InvariantCulture))

      - name: Print checks on this Windows runner
        run: cargo test -p open-pact-client -- --ignored print_run_all_on_this_machine --nocapture
