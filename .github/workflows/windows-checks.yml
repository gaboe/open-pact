name: windows-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Windows client
        run: cargo test -p open-pact-client

      - name: Verify Windows browser source fixtures
        shell: powershell
        run: ./crates/open-pact-client/src/checks/windows_browser_tests.ps1

      - name: Record runner privilege
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $admin = ([Security.Principal.WindowsPrincipal]::new($identity)).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Output "runner_is_administrator=$admin"

      - name: Probe invariant batch values
        shell: powershell
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & ([scriptblock]::Create((Get-Content -Raw crates/open-pact-client/src/checks/windows.ps1))) | ForEach-Object {
            if ($_ -like "browsers`t*") { Write-Output "browser_settings=collected" }
            else { Write-Output $_ }
          }
          $timer.Stop()
          Write-Output ("batch_elapsed_seconds=" + $timer.Elapsed.TotalSeconds.ToString([Globalization.CultureInfo]::InvariantCulture))

      - name: Print checks on this Windows runner
        run: cargo test -p open-pact-client -- --ignored print_run_all_on_this_machine --nocapture
