name: desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'crates/open-pact-core/**'
      - 'crates/open-pact-client/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop.yml'
      # The core and the client compile these files in with include_str! and include_bytes!.
      # scripts/packaging/check_path_filters.py checks the list.
      - 'examples/**'
      - 'PAPER.md'
      - 'README.md'
      - 'docs/client.md'
      - 'docs/controls.md'
      - 'docs/windows-machine-install.md'
      - 'docs/release-notes/**'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/open-pact-core/**'
      - 'crates/open-pact-client/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop.yml'
      # The core and the client compile these files in with include_str! and include_bytes!.
      # scripts/packaging/check_path_filters.py checks the list.
      - 'examples/**'
      - 'PAPER.md'
      - 'README.md'
      - 'docs/client.md'
      - 'docs/controls.md'
      - 'docs/windows-machine-install.md'
      - 'docs/release-notes/**'

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces its run. Runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: desktop -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: KyleMayes/install-llvm-action@v2
        if: runner.os == 'Windows'
        with:
          version: '20.1'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the lock file
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/Cargo.toml
          command: check
          arguments: --all-features --config desktop/deny.toml
          command-arguments: advisories licenses bans sources
