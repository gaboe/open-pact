name: desktop

on:
  push:
    paths:
      - 'desktop/**'
      - 'crates/open-pact-core/**'
      - 'crates/open-pact-client/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/open-pact-core/**'
      - 'crates/open-pact-client/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: desktop -> target
          save-if: true
      - uses: KyleMayes/install-llvm-action@v2
        if: runner.os == 'Windows'
        with:
          version: '20.1'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the lock file
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: desktop/Cargo.toml
          command: check
          arguments: --all-features --config desktop/deny.toml
          command-arguments: advisories licenses bans sources
