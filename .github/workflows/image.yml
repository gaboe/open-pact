name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/open-pact-gateway:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/open-pact-gateway:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "ghcr.io/${{ github.repository_owner }}/open-pact-gateway@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
