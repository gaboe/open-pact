name: image

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**']
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/open-pact-gateway
  WITNESS_IMAGE: ghcr.io/${{ github.repository_owner }}/open-pact-witness

jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Check that the tag names both workspace versions
        if: github.ref_type == 'tag'
        run: python3 scripts/packaging/check-release-version.py "$GITHUB_REF_NAME"

      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=gateway
          cache-to: ${{ github.ref_type != 'tag' && 'type=gha,mode=max,scope=gateway' || '' }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
            ${{ env.GATEWAY_IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

      - run: echo "${GATEWAY_IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  witness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Check that the tag names both workspace versions
        if: github.ref_type == 'tag'
        run: python3 scripts/packaging/check-release-version.py "$GITHUB_REF_NAME"

      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: witness
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=witness
          cache-to: ${{ github.ref_type != 'tag' && 'type=gha,mode=max,scope=witness' || '' }}
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.WITNESS_IMAGE }}:${{ github.sha }}
            ${{ env.WITNESS_IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

      - run: echo "${WITNESS_IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    needs: [gateway, witness]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, witness]
    steps:
      - uses: actions/checkout@v6

      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image == 'witness' && 'witness' || '' }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=oci,dest=${{ runner.temp }}/rebuild.tar,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Compare digests
        env:
          IMAGE_NAME: ${{ matrix.image }}
          PUBLISHED: ${{ matrix.image == 'witness' && needs.witness.outputs.digest || needs.gateway.outputs.digest }}
          REBUILT: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "${IMAGE_NAME} published: \`$PUBLISHED\`"
            echo "${IMAGE_NAME} rebuilt:   \`$REBUILT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" != "$REBUILT" ]; then
            echo "::error::independent rebuild of ${IMAGE_NAME} produced a different digest"
            exit 1
          fi

  release-note:
    if: github.ref_type == 'tag'
    needs: [gateway, witness, rebuild]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      GATEWAY_DIGEST: ${{ needs.gateway.outputs.digest }}
      WITNESS_DIGEST: ${{ needs.witness.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      # client-release.yml alone creates, checks and publishes the release. This job
      # waits for that release and adds the digests to its notes.
      - name: Add digests to the release note
        run: bash scripts/packaging/add-image-notes.sh
