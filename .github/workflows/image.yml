name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/open-pact-gateway

jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=image,push=true,rewrite-timestamp=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}

      - run: echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    needs: gateway
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          no-cache: true
          build-args: SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
          outputs: type=oci,dest=${{ runner.temp }}/rebuild.tar,rewrite-timestamp=true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Compare digests
        env:
          PUBLISHED: ${{ needs.gateway.outputs.digest }}
          REBUILT: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "published: \`$PUBLISHED\`"
            echo "rebuilt:   \`$REBUILT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" != "$REBUILT" ]; then
            echo "::error::independent rebuild produced a different digest"
            exit 1
          fi

  release-note:
    if: github.ref_type == 'tag'
    needs: [gateway, rebuild]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.gateway.outputs.digest }}
    steps:
      - name: Add digest to the release note
        run: |
          note="Image digest (rebuilt independently, identical): \`${IMAGE}@${DIGEST}\`
          Verify with \`scripts/verify-release.sh ${TAG} ${IMAGE}@${DIGEST}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            body=$(gh release view "$TAG" --json body --jq .body)
            gh release edit "$TAG" --notes "${body}"$'\n\n'"${note}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$note"
          fi
