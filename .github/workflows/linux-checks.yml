name: linux-checks

on:
  push:
    paths-ignore: ['desktop/**']
  pull_request:
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Ubuntu container scenarios
        env:
          DISTROS: ubuntu
          PLATFORM: linux/amd64
        run: tests/linux-docker/run.sh
