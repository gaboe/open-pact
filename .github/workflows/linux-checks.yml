name: linux-checks

on:
  push:
    branches: [main]
    paths-ignore: ['desktop/**']
  pull_request:
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces its run. Runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check who may request an identity token
        run: |
          python3 -m venv "$RUNNER_TEMP/policy-venv"
          "$RUNNER_TEMP/policy-venv/bin/pip" install --quiet pyyaml
          "$RUNNER_TEMP/policy-venv/bin/python" -m unittest scripts/packaging/check_workflow_permissions.py

  # The scenarios build the client inside Docker and need no host toolchain, so they run beside
  # the cargo job instead of after it.
  containers:
    name: Ubuntu container scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Ubuntu container scenarios
        env:
          DISTROS: ubuntu
          PLATFORM: linux/amd64
        run: tests/linux-docker/run.sh
