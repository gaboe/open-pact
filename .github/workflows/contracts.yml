name: control-contracts

on:
  push:
    paths-ignore: ['desktop/**']
  pull_request:
    paths-ignore: ['desktop/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: true
      - name: Test all platform contracts
        run: cargo test -p open-pact-client checks::contracts -- --show-output
