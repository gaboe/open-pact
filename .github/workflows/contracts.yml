name: control-contracts

on:
  push:
    branches: [main]
    # Runs unless the change touches only the desktop, the gateway, the witness, deploy/ or docs that no client code reads. scripts/packaging/check_path_filters.py checks the list.
    # The last six lines re-include the docs that client code reads.
    paths:
      - '**'
      - '!desktop/**'
      - '!crates/open-pact-gateway/**'
      - '!crates/open-pact-witness/**'
      - '!deploy/**'
      - '!docs/**'
      - '!*.md'
      - 'docs/client.md'
      - 'docs/controls.md'
      - 'docs/windows-machine-install.md'
      - 'docs/release-notes/**'
      - 'README.md'
      - 'PAPER.md'
  pull_request:
    # Runs unless the change touches only the desktop, the gateway, the witness, deploy/ or docs that no client code reads. scripts/packaging/check_path_filters.py checks the list.
    # The last six lines re-include the docs that client code reads.
    paths:
      - '**'
      - '!desktop/**'
      - '!crates/open-pact-gateway/**'
      - '!crates/open-pact-witness/**'
      - '!deploy/**'
      - '!docs/**'
      - '!*.md'
      - 'docs/client.md'
      - 'docs/controls.md'
      - 'docs/windows-machine-install.md'
      - 'docs/release-notes/**'
      - 'README.md'
      - 'PAPER.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request replaces its run. Runs on main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test all platform contracts
        run: cargo test -p open-pact-client checks::contracts -- --show-output
