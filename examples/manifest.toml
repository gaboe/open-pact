manifest_version = 1
issuer = "company.example"
valid_from = "2026-10-01"
claim_max_age = "24h"
claim_retention = "12mo"
claim_recipients = ["Company IT security", "auditor on request"]
disclosed_metadata = ["manifest_hash", "device_pseudonym", "device_key", "nonce", "time", "client_version", "os", "trust_level", "vpn_certificate_request", "virtualized", "log_checkpoint"]
data_controller = "Company Ltd., dpo@company.example"
min_trust_level = "L0"               # demo only: software device keys are L0
unknown_grace = "7d"

[[control]]
id = "disk_encryption"
source = "customer_contract"
source_ref = "Client contract, security annex, 4.2"
rationale = "A lost laptop must not expose client data."
check = "builtin:disk_encryption@1"
output = ["full", "partial", "none", "unknown"]
required = { macos = "full", windows = "full", linux = "full" }
grace = "0d"

[[control]]
id = "firewall"
source = "company_policy"
check = "builtin:firewall@1"
output = ["on", "off", "unknown"]
required = { macos = "on", windows = "on", linux = "on" }
grace = "1d"

[[control]]
id = "screen_lock"
source = "customer_contract"
source_ref = "Flow-down of RTS 2024/1774 Art. 13(l)"
check = "builtin:screen_lock@1"
output = ["le_5min", "le_15min", "gt_15min", "none", "unknown"]
required = { macos = "le_5min", windows = "le_5min", linux = "le_5min" }
grace = "1d"

[[control]]
id = "os_patch_age_days"
source = "company_policy"
rationale = "Limit the age of the last whole-system OS update."
check = "builtin:os_patch_age_days@1"
output = { integer = { min = 0, max = 3650 } }
required = { macos = { max = 30 }, windows = { max = 30 }, linux = { max = 30 } }
grace = "1d"

[[control]]
id = "os_supported"
source = "standard"
check = "builtin:os_supported@1"
output = ["yes", "no", "unknown"]
required = { macos = "yes", windows = "yes", linux = "yes" }
grace = "14d"

# Illustrative V3.1 baseline. The empty requirements below report values only.

[[control]]
id = "antimalware_active"
source = "company_policy"
check = "builtin:antimalware_active@1"
output = ["yes", "no", "unknown"]
required = { macos = "yes", windows = "yes", linux = "yes" }
grace = "1d"

[[control]]
id = "preboot_auth"
source = "company_policy"
check = "builtin:preboot_auth@1"
output = ["user_secret", "hardware_only", "none", "unknown"]
required = { macos = "user_secret", windows = "user_secret", linux = "user_secret" }
grace = "1d"

[[control]]
id = "antimalware_signature_age_days"
source = "company_policy"
check = "builtin:antimalware_signature_age_days@1"
output = { integer = { min = 0, max = 3650 } }
required = { macos = { max = 3 }, windows = { max = 3 }, linux = { max = 3 } }
grace = "1d"

[[control]]
id = "antimalware_full_scan_age_days"
source = "company_policy"
check = "builtin:antimalware_full_scan_age_days@1"
output = { integer = { min = 0, max = 3650 }, values = ["n/a"] }
required = {}
grace = "1d"

[[control]]
id = "web_protection"
source = "company_policy"
check = "builtin:web_protection@1"
output = ["on", "off", "unknown", "n/a"]
required = {}
grace = "1d"

[[control]]
id = "log_oldest_record_days"
source = "company_policy"
check = "builtin:log_oldest_record_days@1"
output = { integer = { min = 0, max = 2147483647 }, values = ["n/a"] }
required = { windows = { min = 90 }, macos = "n/a" }
grace = "1d"

[[control]]
id = "process_audit"
source = "company_policy"
check = "builtin:process_audit@1"
output = ["on", "off", "n/a", "unknown"]
required = { windows = "on", macos = "n/a", linux = "n/a" }
grace = "1d"

[[control]]
id = "powershell_logging"
source = "company_policy"
check = "builtin:powershell_logging@1"
output = ["on", "off", "n/a", "unknown"]
required = { windows = "on", macos = "n/a", linux = "n/a" }
grace = "1d"

[[control]]
id = "log_cleared"
source = "company_policy"
check = "builtin:log_cleared@1"
output = { timestamp = true, nullable = true, values = ["n/a"] }
required = { windows = "null", macos = "n/a", linux = "n/a" }
grace = "1d"

[[control]]
id = "os_auto_updates"
source = "company_policy"
check = "builtin:os_auto_updates@1"
output = ["on", "off", "unknown"]
required = { macos = "on", windows = "on", linux = "on" }
grace = "1d"

[[control]]
id = "antimalware_realtime"
source = "company_policy"
check = "builtin:antimalware_realtime@1"
output = ["on", "off", "unknown"]
required = { macos = "on", windows = "on", linux = "on" }
grace = "1d"

[[control]]
id = "antimalware_active_threats"
source = "company_policy"
check = "builtin:antimalware_active_threats@1"
output = { integer = { min = 0, max = 2147483647 }, values = ["n/a"] }
required = { windows = { max = 0 }, macos = "n/a" }
grace = "1d"

[[control]]
id = "work_account"
source = "company_policy"
check = "builtin:work_account@1"
output = ["standard", "admin", "unknown"]
required = {}
grace = "1d"

[[control]]
id = "uptime_days"
source = "company_policy"
check = "builtin:uptime_days@1"
output = { integer = { min = 0, max = 2147483647 } }
required = {}
grace = "1d"

[log]
# Demo only: this witness key comes from a public seed, so anyone can forge its cosignatures.
